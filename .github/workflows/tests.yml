name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/Scrubx.Tests/Scrubx.Tests.csproj

      - name: Test
        run: dotnet test tests/Scrubx.Tests/Scrubx.Tests.csproj --no-restore --verbosity normal
